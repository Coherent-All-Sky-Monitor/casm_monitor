# casm_monitor configuration. Path override: env CASM_MONITOR_CONFIG.
# NOTE: no secrets live here. The redis password and the LMC port are read at
# runtime from medusa.cfg (Fourier Space's own file, read-only).

store_root: /mnt/nvme3/casm_monitor

web:
  host: 127.0.0.1
  port: 8060

paths:
  vis_dir: /mnt/nvme4/data/casm/visibilities_64ant
  hella_cands_dir: /mnt/nvme4/data/casm/hella_cands
  t2_db: /mnt/nvme5/casm_pipeline/db/t2.sqlite
  registry_dir: /mnt/nvme5/casm_pipeline/weights/registry
  deployed_weights_csv: /home/casm/software/dev/casm-wiki/deployed_weights.csv
  medusa_cfg: /home/casm/software/fourier-space/opt/casm/share/common/medusa.cfg

kafka:
  bootstrap: casm-corr1:9092
  topics:
    - casm_antenna_bp
    - casm_antenna_ts
    - casm_antenna_hg
  # A frame waits this long for all six subband producers before it is emitted
  # incomplete, counted from its FIRST record. The measured producer skew is
  # ~68 s (corr1 streams ~28 s behind the frame timestamp, corr2 ~96 s), so
  # this must stay well above that.
  frame_timeout_s: 150

hosts:
  # corr1 is local; corr2 and zapdos are reached over ssh (BatchMode, key auth).
  corr2_ssh: casm-corr2
  zapdos_ssh: zapdos
  check_head_node: false

disks:
  - /mnt/nvme3
  - /mnt/nvme4
  - /mnt/nvme5

# Collector cadences in seconds. zapdos is contacted at most once per hour and
# the collector additionally refuses to probe more often than
# zapdos_min_interval_s, so a service restart loop cannot spam it.
cadences:
  obs: 30
  hella: 60
  hella_corr2: 600
  services: 30
  zapdos: 3600
  disks: 300
  gpus: 60
  weights: 120
  sky: 60
  # The Kafka bandpass consumer polls once a second inside the runner;
  # kafka_bp_frame is the 10 s frame cadence the status strip grades against.
  kafka_bp: 1
  kafka_bp_frame: 30
  # cheap tick: one SQLite query; the hourly gate is inside the collector
  snapread: 60
  # visibilities: polled 30 s against a 137.44 s integration (see vis: below)
  vis: 30
  search: 20
  # Not a collector: the spacing the status strip grades the visibility items
  # against (3 x 137.438953472 s, i.e. accumulation + guard band + stability poll).
  vis_integration: 412.32
  store: 300

zapdos_min_interval_s: 7200

# SNAP board reads over zapdos. Strictly sequential, one ssh session, at most
# once an hour from the scheduler (read_interval_s is clamped to >= 3600 in
# code) and otherwise only on an operator click, itself rate-limited to one per
# manual_min_interval_s. The antenna board list is deliberately NOT duplicated
# here: it is read from the SNAP map CSV at runtime.
snap:
  antenna_boards:
    from_csv: /home/casm/software/dev/antenna_layouts/casm_snap_map.csv
  # Antenna-less relay boards in the PPS chain, shown as PPS-only cards.
  relay_boards:
    - 192.168.120.59
    - 192.168.120.68
    - 192.168.120.69
  # Layout CSV giving (snap, adc) -> packet_idx / antenna for the scalars.
  # Same file the /api/snaps/boards table reads (rowmap.LAYOUT_CSV): the
  # ``current`` symlink, so casm-layout apply is picked up everywhere at once.
  layout_csv: /home/casm/software/dev/antenna_layouts/current
  read_interval_s: 7200
  manual_min_interval_s: 300
  per_board_timeout_s: 60

# Visibilities (M2). The cached sub-matrix is every WIRED input of the layout
# (functional=1, re-read at every integration so the set grows by itself);
# include_in_beamforming=1 is the default DISPLAY set. Only those two sets exist
# (operator decision 2026-09-08). The collector reads each COMPLETE integration
# once, keeps one integration as a guard band behind the growing file's end, and
# never crosses a file boundary in one read.
vis:
  dir: /mnt/nvme4/data/casm/visibilities_64ant
  cadence: 30
  # First start (and any gap) backfills at most this many hours of complete
  # integrations, oldest first, under the same watermark.
  backfill_hours: 12
  # Integrations one pass may read (0.12 s each at 24 inputs / 300 baselines),
  # so a 12 h backfill spreads over a few passes instead of one long one.
  max_integrations_per_pass: 64

# Per-stream shard time-to-live in days, used by the retention helper. Every
# shard stream and its TTL (a stream with no key here is kept forever):
#   kafka_bp_full   14 d    60 s full-resolution frames (3072 ch)
#   kafka_bp_sub    90 d    10 s frames reduced to 96 channels
#   kafka_bp_night  none    the 02:00-05:00 PT nightly median
#   snap_read       none    board-side reads over zapdos (never expires)
#   vis_full         3 d    one shard per integration, 3072 ch, wired inputs
#   vis_avg8        60 d    eight integrations per shard, 8x chan-averaged
shard_ttl_days:
  kafka_bp_full: 14
  kafka_bp_sub: 90
  vis_full: 3
  vis_avg8: 60

# M3 gate: the weights upload button stays disabled unless this is true AND
# CASM_MONITOR_ALLOW_UPLOAD=1 is set in the unit environment.
allow_upload: false
